name: RAG Eval

on:
  push:
    paths:
      - "wiki/**"
      - "raw/**"
      - "rag/**"
      - ".github/workflows/rag-eval.yml"
  pull_request:
    paths:
      - "wiki/**"
      - "raw/**"
      - "rag/**"
      - ".github/workflows/rag-eval.yml"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: rag/requirements.txt

      # Avoids re-embedding ~4100 chunks on every run when wiki/raw/rag code
      # hasn't changed since the last successful run.
      - name: Cache RAG index
        uses: actions/cache@v4
        with:
          path: rag/.index
          key: rag-index-${{ hashFiles('wiki/**', 'raw/**', 'rag/**/*.py') }}

      - name: Install dependencies
        run: pip install -r rag/requirements.txt

      # Report-only for now: run without --strict until thresholds in
      # rag/eval/thresholds.py are calibrated against real baseline runs.
      - name: Run RAG eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m rag.eval.run_eval

      - name: Write job summary
        if: always()
        run: cat rag/eval/results/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-results
          path: rag/eval/results/
